name: cpa-agent-prod

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
      CPA_DEMO_MODE: "${CPA_DEMO_MODE:-false}"
      FLASK_DEBUG: "false"
      FLASK_HOST: "0.0.0.0"
      FLASK_PORT: "5001"
      LLM_PROVIDER: "${LLM_PROVIDER:-deepseek}"
      LLM_API_KEY: "${LLM_API_KEY:?LLM_API_KEY is required}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME:-}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-cpa_agent}"
      REDIS_URL: "redis://redis:6379/0"
      CPA_SESSION_TURN_LOCK_MODE: "redis_required"
      MILVUS_URI: "/app/milvus_data/milvus.db"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-m3}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-1024}"
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
      - backend_milvus_data:/app/milvus_data
      - backend_modelscope_cache:/app/modelscope_cache
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_logs:
  backend_milvus_data:
  backend_modelscope_cache:
