# LLM Provider Presets — repo 权威默认
# 密钥保留 .env；base_url/model 可在此覆盖

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    model: "gpt-4o-mini"

  deepseek:
    base_url: "https://api.deepseek.com/v1"
    model: "deepseek-chat"

  qwen:
    # 通义千问 OpenAI 兼容模式
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"

  moonshot:
    base_url: "https://api.moonshot.cn/v1"
    model: "moonshot-v1-8k"

  zhipu:
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model: "glm-4"

  ollama:
    base_url: "http://localhost:11434/v1"
    model: "qwen2.5:latest"

  vllm:
    base_url: "http://localhost:8000/v1"
    model: "Qwen/Qwen2.5-7B-Instruct"

  lmstudio:
    base_url: "http://localhost:1234/v1"
    model: "local-model"

  custom:
    base_url: null
    model: null

defaults:
  # 启动时默认 provider，.env 中 LLM_PROVIDER 可覆盖
  provider: "deepseek"
  timeout: 120
  # 故障转移顺序（.env LLM_FAILOVER_ORDER 可覆盖，逗号分隔）
  failover_order:
    - deepseek
    - qwen
