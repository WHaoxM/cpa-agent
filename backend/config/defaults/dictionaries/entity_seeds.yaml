    category: 软考
    aliases:
      - 系统架构设计师
      - 信息系统项目管理师
  - canonical_name: PMP
    category: 项目管理
    aliases:
      - PMP认证
      - PMP项目管理专业人士认证
      - 项目管理专业人士认证
      - 项目管理专业人士
  - canonical_name: AWS认证
    category: 云计算
    aliases:
      - AWS Certified
      - AWS Certified Solutions Architect
      - AWS认证助理级
  - canonical_name: Oracle认证
