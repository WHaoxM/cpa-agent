# Prompt Registry — 单一索引
# 每个 prompt_id 一个文件夹，层文件固定命名 base.md / tone.md
# workspace 只允许覆盖 tone.md (经 PromptLoader 合并)

runtime_routes:
  - engine: supervisor
    mode: ask
    content_kind: text
    description: Ask 普通问答模型头
    prompt_ids:
      - agent.ask.manual
      - agent.ask.system

  - engine: supervisor
    mode: ask
    content_kind: attachment
    description: Ask 附件问答模型头，不含内部工具名
    prompt_ids:
      - agent.ask.manual
      - agent.ask.attachment_qa.system
      - agent.attachment.integrity.system

  - engine: supervisor
    mode: ask
    content_kind: thinking
    description: Ask thinking 操作指令
    prompt_ids:
      - agent.ask.thinking.system

  - engine: supervisor
    mode: agent
    content_kind: text
    description: Agent 单子任务编排模型头
    prompt_ids:
      - agent.manual
      - agent.agent.system

  - engine: supervisor
    mode: agent
    content_kind: router
    description: Agent 路由器 JSON 契约
    prompt_ids:
      - agent.router.system

  - engine: supervisor
    mode: experts
    content_kind: text
    description: Experts 多步编排模型头
    prompt_ids:
      - agent.manual
      - agent.experts.system

  - engine: supervisor
    mode: experts
    content_kind: lead
    description: Experts Lead JSON 契约
    prompt_ids:
      - agent.experts.lead.system

  - engine: subagent
    mode: ask
    content_kind: attachment
    subagent: qa
    description: Ask 附件 QA 子调用模型头，不加载 Agent QA 工具手册
    prompt_ids:
      - agent.ask.manual
      - agent.ask.attachment_qa.system
      - agent.task_packet.system

  - engine: subagent
    mode: agent
    content_kind: text
    subagent: profile
    prompt_ids: [agent.manual, agent.profile.system, agent.task_packet.system]
  - engine: subagent
    mode: agent
    content_kind: text
    subagent: match
    prompt_ids: [agent.manual, agent.match.system, agent.task_packet.system]
  - engine: subagent
    mode: agent
    content_kind: text
    subagent: report
    prompt_ids: [agent.manual, agent.report.system, agent.task_packet.system]
  - engine: subagent
    mode: agent
    content_kind: text
    subagent: planner
    prompt_ids: [agent.manual, agent.planner.system, agent.task_packet.system]
  - engine: subagent
    mode: agent
    content_kind: text
    subagent: qa
    prompt_ids: [agent.manual, agent.qa.system, agent.task_packet.system]

  - engine: subagent
    mode: experts
    content_kind: text
    subagent: profile
    prompt_ids: [agent.manual, agent.profile.system, agent.task_packet.system]
  - engine: subagent
    mode: experts
    content_kind: text
    subagent: match
    prompt_ids: [agent.manual, agent.match.system, agent.task_packet.system]
  - engine: subagent
    mode: experts
    content_kind: text
    subagent: report
    prompt_ids: [agent.manual, agent.report.system, agent.task_packet.system]
  - engine: subagent
    mode: experts
    content_kind: text
    subagent: planner
    prompt_ids: [agent.manual, agent.planner.system, agent.task_packet.system]
  - engine: subagent
    mode: experts
    content_kind: text
    subagent: qa
    prompt_ids: [agent.manual, agent.qa.system, agent.task_packet.system]

prompts:
  - id: agent.chat.system
    description: ReAct Agent 对话系统提示词 (工具调用 + 阶段感知)
    base: agent.chat.system/base.md
    tone: agent.chat.system/tone.md
    consumers:
      - app.services.react_agent
    variables:
      - tools_description

  # ------------------------------------------------------------------
  # entity_extractor — 简历抽取 (Qwen3-0.6B 极简指令)
  # ------------------------------------------------------------------
  - id: entity.resume.system
    description: 简历抽取系统提示词 — 强制 XML 标签规则
    base: entity.resume.system/base.md
    tone: entity.resume.system/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.resume_prompts

  - id: entity.resume.user.basic_info
    description: 简历基本信息抽取
    base: entity.resume.user.basic_info/base.md
    tone: entity.resume.user.basic_info/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.resume_prompts
    variables:
      - indexed_text

  - id: entity.resume.user.education
    description: 简历教育经历抽取
    base: entity.resume.user.education/base.md
    tone: entity.resume.user.education/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.resume_prompts
    variables:
      - indexed_text
      - confirmed

  - id: entity.resume.user.experience
    description: 简历工作/项目经历抽取
    base: entity.resume.user.experience/base.md
    tone: entity.resume.user.experience/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.resume_prompts
    variables:
      - indexed_text
      - confirmed

  - id: entity.resume.user.skills
    description: 简历技能抽取
    base: entity.resume.user.skills/base.md
    tone: entity.resume.user.skills/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.resume_prompts
    variables:
      - indexed_text
      - constraint

  # ------------------------------------------------------------------
  # entity_extractor — JD 抽取
  # ------------------------------------------------------------------
  - id: entity.jd.system
    description: JD 抽取系统提示词 — JSON-only 严格模式
    base: entity.jd.system/base.md
    tone: entity.jd.system/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.jd_prompts

  - id: entity.jd.user.job_info
    description: JD 职位基本信息抽取
    base: entity.jd.user.job_info/base.md
    tone: entity.jd.user.job_info/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.jd_prompts
    variables:
      - jd_text

  - id: entity.jd.user.requirements
    description: JD 任职要求抽取
    base: entity.jd.user.requirements/base.md
    tone: entity.jd.user.requirements/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.jd_prompts
    variables:
      - jd_text
      - constraints

  - id: entity.jd.user.description
    description: JD 职责/描述抽取
    base: entity.jd.user.description/base.md
    tone: entity.jd.user.description/tone.md
    consumers:
      - app.pipeline.entity_extractor.prompts.jd_prompts
    variables:
      - jd_text

  # ------------------------------------------------------------------
  # tool.llm_reason — ReAct Agent 推理工具
  # ------------------------------------------------------------------
  - id: tool.llm_reason.system
    description: llm_reason 工具系统提示词（职业规划专家）
    base: tool.llm_reason.system/base.md
    tone: tool.llm_reason.system/tone.md
    consumers:
      - app.services.tools.llm_reason

  # ------------------------------------------------------------------
  # entity_normalizer — OOV 闭环 LLM 归一化
  # ------------------------------------------------------------------
  - id: entity.normalize.user.award
    description: 奖项级别归一化（国家级/省级/校级）
    base: entity.normalize.user.award/base.md
    tone: entity.normalize.user.award/tone.md
    consumers:
      - app.services.entity_normalizer
    variables:
      - name
      - ctx

  - id: entity.normalize.user.generic
    description: 通用实体（技能/职位/专业/证书）归一化
    base: entity.normalize.user.generic/base.md
    tone: entity.normalize.user.generic/tone.md
    consumers:
      - app.services.entity_normalizer
    variables:
      - label
      - name
      - ctx

  # ------------------------------------------------------------------
  # text_cyber — Text-to-Cypher 三段 prompt
  # ------------------------------------------------------------------
  - id: cypher.intent.user
    description: Cypher 意图理解（节点/关系/路径/聚合/Schema/相似度）
    base: cypher.intent.user/base.md
    tone: cypher.intent.user/tone.md
    consumers:
      - app.validators.text_cyber
    variables:
      - query

  - id: cypher.generate.user
    description: 自然语言 → Cypher (READ-ONLY 安全约束)
    base: cypher.generate.user/base.md
    tone: cypher.generate.user/tone.md
    consumers:
      - app.validators.text_cyber
    variables:
      - query

  - id: cypher.rewrite.user
    description: Cypher 查询结果 → 自然语言中文回复
    base: cypher.rewrite.user/base.md
    tone: cypher.rewrite.user/tone.md
    consumers:
      - app.validators.text_cyber
    variables:
      - original_query
      - result_json

  # ------------------------------------------------------------------
  # l4_report_generator — 报告 LLM 摘要
  # ------------------------------------------------------------------
  - id: report.summary.user
    description: 人岗匹配报告 100 字摘要生成
    base: report.summary.user/base.md
    tone: report.summary.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.l4_report_generator
    variables:
      - match_score
      - match_level
      - skill_coverage_pct
      - matched_skills
      - missing_skills
      - gap_lines

  # ------------------------------------------------------------------
  # graph_query tool — 携带 schema 上下文的 Cypher 生成
  # ------------------------------------------------------------------
  - id: tool.graph_query.system
    description: graph_query 工具系统提示词（携带动态 Neo4j schema）
    base: tool.graph_query.system/base.md
    tone: tool.graph_query.system/tone.md
    consumers:
      - app.services.tools.graph_query
    variables:
      - schema
      - query_type

  # ------------------------------------------------------------------
  # langgraph_agent — 备用 agent 系统提示词（基于 LangGraph 状态机）
  # ------------------------------------------------------------------
  - id: agent.langgraph.system
    description: LangGraph Agent 系统提示词（含用户阶段感知；legacy mode）
    base: agent.langgraph.system/base.md
    tone: agent.langgraph.system/tone.md
    consumers:
      - app.services.langgraph_agent
      - app.services.agent_runtime.legacy

  # ------------------------------------------------------------------
  # Supervisor + Expert bundles（上下文隔离运行时）
  # ------------------------------------------------------------------
  - id: agent.manual
    description: 共享 Work Manual（隔离/黑板 ACL/工具/记忆禁令）
    base: agent.manual/base.md
    tone: agent.manual/tone.md
    consumers:
      - app.services.agent_runtime.supervisor
      - app.services.agent_runtime.scoped_invoke
      - app.services.agent_runtime.subagent_graphs

  - id: agent.supervisor.system
    description: Supervisor 编排器系统提示
    base: agent.supervisor.system/base.md
    tone: agent.supervisor.system/tone.md
    consumers:
      - app.services.agent_runtime.supervisor

  - id: agent.ask.manual
    description: Ask 用户通道契约（产品语义，不含内部工具/黑板名）
    base: agent.ask.manual/base.md
    tone: agent.ask.manual/tone.md
    consumers:
      - app.services.agent_runtime.prefix

  - id: agent.ask.system
    description: Ask 交互模式系统提示（轻量问答）
    base: agent.ask.system/base.md
    tone: agent.ask.system/tone.md
    consumers:
      - app.services.agent_runtime.mode_runtime
      - app.services.agent_runtime.prefix

  - id: agent.agent.system
    description: Agent 交互模式系统提示（单子 Agent）
    base: agent.agent.system/base.md
    tone: agent.agent.system/tone.md
    consumers:
      - app.services.agent_runtime.mode_runtime
      - app.services.agent_runtime.prefix

  - id: agent.experts.system
    description: Experts 交互模式系统提示（Lead 多步）
    base: agent.experts.system/base.md
    tone: agent.experts.system/tone.md
    consumers:
      - app.services.agent_runtime.mode_runtime
      - app.services.agent_runtime.prefix

  - id: agent.profile.system
    description: profile 子 Agent 系统提示
    base: agent.profile.system/base.md
    tone: agent.profile.system/tone.md
    consumers:
      - app.services.agent_runtime.scoped_invoke
      - app.services.agent_runtime.subagent_graphs

  - id: agent.match.system
    description: match 子 Agent 系统提示
    base: agent.match.system/base.md
    tone: agent.match.system/tone.md
    consumers:
      - app.services.agent_runtime.scoped_invoke
      - app.services.agent_runtime.subagent_graphs

  - id: agent.report.system
    description: report 子 Agent 系统提示
    base: agent.report.system/base.md
    tone: agent.report.system/tone.md
    consumers:
      - app.services.agent_runtime.scoped_invoke
      - app.services.agent_runtime.subagent_graphs

  - id: agent.planner.system
    description: planner 子 Agent 系统提示
    base: agent.planner.system/base.md
    tone: agent.planner.system/tone.md
    consumers:
      - app.services.agent_runtime.scoped_invoke
      - app.services.agent_runtime.subagent_graphs

  - id: agent.qa.system
    description: qa 子 Agent 系统提示
    base: agent.qa.system/base.md
    tone: agent.qa.system/tone.md
    consumers:
      - app.services.agent_runtime.scoped_invoke

  - id: agent.ask.attachment_qa.system
    description: Ask 附件问答系统提示（产品语义，不暴露内部工具名）
    base: agent.ask.attachment_qa.system/base.md
    tone: agent.ask.attachment_qa.system/tone.md
    consumers:
      - app.services.agent_runtime.prompt_selector
      - app.services.agent_runtime.scoped_invoke

  - id: agent.router.system
    description: Agent 模式路由器 JSON 契约
    base: agent.router.system/base.md
    tone: agent.router.system/tone.md
    consumers:
      - app.services.agent_runtime.mode_runtime
    variables:
      - router_context
      - message

  - id: agent.experts.lead.system
    description: Experts Lead JSON 契约
    base: agent.experts.lead.system/base.md
    tone: agent.experts.lead.system/tone.md
    consumers:
      - app.services.agent_runtime.experts_lead
    variables:
      - templates
      - slots
      - known_slots_json
      - template_hint
      - card
      - summary
      - memory_digest
      - message

  - id: agent.ask.thinking.system
    description: Ask thinking 操作指令（只进模型，不出站）
    base: agent.ask.thinking.system/base.md
    tone: agent.ask.thinking.system/tone.md
    consumers:
      - app.services.agent_runtime.thinking_trace

  - id: agent.attachment.integrity.system
    description: 附件完整性模型指令
    base: agent.attachment.integrity.system/base.md
    tone: agent.attachment.integrity.system/tone.md
    consumers:
      - app.services.agent_runtime.mode_runtime
      - app.services.agent_runtime.scoped_invoke

  - id: agent.task_packet.system
    description: 子 Agent TaskPacket 瘦包规则
    base: agent.task_packet.system/base.md
    tone: agent.task_packet.system/tone.md
    consumers:
      - app.services.agent_runtime.scoped_invoke

  # ------------------------------------------------------------------
  # llm_skill_extractor — LLM 技能抽取 prompt
  # ------------------------------------------------------------------
  - id: entity.skill_extractor.user
    description: LLM 技能抽取（硬技能 + 软技能 + 掌握程度）
    base: entity.skill_extractor.user/base.md
    tone: entity.skill_extractor.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.llm_skill_extractor
    variables:
      - text

  # ------------------------------------------------------------------
  # nsle_pipeline — DeepSeek 版本 LLM 抽取 prompt
  # ------------------------------------------------------------------
  - id: pipeline.nsle.extract.skills.user
    description: NS-LE 简历技能抽取（技能数组 + reasoning）
    base: pipeline.nsle.extract.skills.user/base.md
    tone: pipeline.nsle.extract.skills.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.nsle_pipeline
    variables:
      - text

  - id: pipeline.nsle.extract.experience.user
    description: NS-LE 工作经历抽取
    base: pipeline.nsle.extract.experience.user/base.md
    tone: pipeline.nsle.extract.experience.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.nsle_pipeline
    variables:
      - text

  - id: pipeline.nsle.extract.education.user
    description: NS-LE 教育经历抽取
    base: pipeline.nsle.extract.education.user/base.md
    tone: pipeline.nsle.extract.education.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.nsle_pipeline
    variables:
      - text

  - id: pipeline.nsle.extract.certificates.user
    description: NS-LE 证书与资格认证抽取
    base: pipeline.nsle.extract.certificates.user/base.md
    tone: pipeline.nsle.extract.certificates.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.nsle_pipeline
    variables:
      - text

  - id: pipeline.nsle.extract.basic_info.user
    description: NS-LE 基本信息抽取（姓名/联系方式/年级）
    base: pipeline.nsle.extract.basic_info.user/base.md
    tone: pipeline.nsle.extract.basic_info.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.nsle_pipeline
    variables:
      - text

  - id: pipeline.nsle.extract.awards.user
    description: NS-LE 竞赛/奖学金/荣誉抽取
    base: pipeline.nsle.extract.awards.user/base.md
    tone: pipeline.nsle.extract.awards.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.nsle_pipeline
    variables:
      - text

  - id: pipeline.nsle.extract.student_profile.user
    description: Resume Structure Truth — 全文/窗口 canonical student_profile（LLM only）
    base: pipeline.nsle.extract.student_profile.user/base.md
    tone: pipeline.nsle.extract.student_profile.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.resume_structure
      - app.pipeline.entity_extractor.nsle_pipeline
    variables:
      - text

  - id: pipeline.nsle.merge.student_profile.user
    description: Resume Structure Truth — 多窗口 LLM merge 为单一 student_profile
    base: pipeline.nsle.merge.student_profile.user/base.md
    tone: pipeline.nsle.merge.student_profile.user/tone.md
    consumers:
      - app.pipeline.entity_extractor.resume_structure
    variables:
      - partials_json

  # ------------------------------------------------------------------
  # admin_kb — 知识库智能上传实体解析
  # ------------------------------------------------------------------
  - id: admin.kb.extract_entities.user
    description: 知识库上传内容实体解析（技能/职业/关系/薪资/需求）
    base: admin.kb.extract_entities.user/base.md
    tone: admin.kb.extract_entities.user/tone.md
    consumers:
      - app.api.admin_kb
    variables:
      - source_type
      - content

  # ------------------------------------------------------------------
  # scripts/ — 冷启动脚本 prompt (向量化种子数据)
  # ------------------------------------------------------------------
  - id: script.vector.skill_enrich.user
    description: generate_vectors.py 技能语义丰富化 (150-200 字)
    base: script.vector.skill_enrich.user/base.md
    tone: script.vector.skill_enrich.user/tone.md
    consumers:
      - scripts.generate_vectors
    variables:
      - name
      - cat
      - sub
      - tier

  - id: script.vector.jd_chunk.user
    description: generate_vectors.py JD 切片向量化 (200-300 字)
    base: script.vector.jd_chunk.user/base.md
    tone: script.vector.jd_chunk.user/tone.md
    consumers:
      - scripts.generate_vectors
    variables:
      - position
      - company
      - category

  - id: script.vector.skill_seed_enrich.user
    description: seed_skill_vectors.py 种子技能丰富化 (含 orig 字段)
    base: script.vector.skill_seed_enrich.user/base.md
    tone: script.vector.skill_seed_enrich.user/tone.md
    consumers:
      - scripts.seed_skill_vectors
    variables:
      - name
      - cat
      - sub
      - tier
      - orig

  - id: agent.career_suggestions.user
    description: 职业匹配建议 — 仅输出 JSON suggestions 数组
    base: agent.career_suggestions.user/base.md
    tone: agent.career_suggestions.user/tone.md
    consumers:
      - app.api.ai_analysis
    variables:
      - context_json

  - id: ai.growth_analysis.user
    description: 报告成长分析 — AIAnalysisResult JSON
    base: ai.growth_analysis.user/base.md
    tone: ai.growth_analysis.user/tone.md
    consumers:
      - app.api.ai_analysis
    variables:
      - context_json
